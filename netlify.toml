[build]
  command = "npm --prefix ChatBot-Becas install && npm --prefix ChatBot-Becas run build"
  publish = "ChatBot-Becas/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg-hstore"]

# Redirección de llamadas de API hacia la función serverless de Express + Sequelize
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Redirección para el enrutador SPA de React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
